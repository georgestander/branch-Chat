<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branchy Chat</title>
  </head>
  <body>
    <div id="app">
      <main class="shell">
        <section class="card">
          <p class="eyebrow">Branchy Chat desktop shell</p>
          <h1>Native window online.</h1>
          <p id="status" class="status">Waiting for the main process.</p>
          <dl class="details">
            <div>
              <dt>Platform</dt>
              <dd id="platform">—</dd>
            </div>
            <div>
              <dt>Electron</dt>
              <dd id="electron">—</dd>
            </div>
            <div>
              <dt>Node</dt>
              <dd id="node">—</dd>
            </div>
          </dl>
          <button id="refresh" type="button">Refresh bridge status</button>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
